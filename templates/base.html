<!doctype html>
<html lang="{{ site.lang }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{% block title %}{{ site.title }}{% endblock %}</title>
<meta name="description" content="{% block description %}{{ site.description }}{% endblock %}">
<meta property="og:title" content="{{ self.title() }}">
<meta property="og:description" content="{{ self.description() }}">
<meta property="og:type" content="website">
{% if canonical %}<link rel="canonical" href="{{ canonical }}">
<meta property="og:url" content="{{ canonical }}">{% endif %}
<meta name="theme-color" content="#f7f6f3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16171a" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
{% if single %}<link rel="icon" href="{{ icon_uri }}" type="image/svg+xml">
<style>
{{ css|safe }}
</style>
{% else %}<link rel="icon" href="{{ root }}assets/icon.svg" type="image/svg+xml">
<link rel="manifest" href="{{ root }}manifest.webmanifest">
<link rel="stylesheet" href="{{ root }}assets/style.css?v={{ version }}">{% endif %}
<script>
try { var t = localStorage.getItem("omap.theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
</script>
</head>
<body class="{% block body_class %}{% endblock %}" data-root="{{ root }}" data-version="{{ version }}"{% if single %} data-single{% endif %}>
<a class="skip" href="#main">К содержимому</a>
{% block body %}{% endblock %}
{% if single %}<script type="application/json" id="omap-data">{{ data|safe }}</script>
<script>
{{ js|safe }}
</script>
{% else %}<script src="{{ root }}assets/app.js?v={{ version }}" defer></script>{% endif %}
</body>
</html>
