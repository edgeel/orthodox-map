[package]
name = "orthodox-map"
version = "0.1.0"
edition = "2024"
description = "Static site generator for the Orthodox study map (Карта изучения православия)"
license = "MIT"
repository = "https://github.com/edgeel/orthodox-map"
default-run = "omap"

[lib]
name = "orthodox_map"
path = "src/lib.rs"

[[bin]]
name = "omap"
path = "src/main.rs"

[dependencies]
anyhow = "1"
anstream = "0.6"
anstyle = "1"
clap = { version = "4", features = ["derive"] }
clap_complete = { version = "4", features = ["unstable-dynamic"] }
minijinja = "2"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tiny_http = "0.12"
toml = "0.9"

[profile.release]
strip = true
